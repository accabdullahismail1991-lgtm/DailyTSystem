<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النظام الموحد — الحوالات والمحاسبة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#262b36; --gold:#c8a45e;
    --text:#e8e6e1; --muted:#9aa0ac;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #shell-nav{
    display:flex; align-items:center; gap:10px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  #shell-nav .brand{
    font-weight:800; font-size:15px; color:var(--gold); margin-left:auto;
    white-space:nowrap;
  }
  .switch-btn{
    appearance:none; border:1px solid var(--border); background:transparent;
    color:var(--muted); padding:9px 18px; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:700; transition:.15s;
    display:flex; align-items:center; gap:8px;
  }
  .switch-btn:hover{border-color:var(--gold); color:var(--text);}
  .switch-btn.active{
    background:linear-gradient(135deg,var(--gold),#a9803f); color:#1a1a1a; border-color:var(--gold);
  }
  #frame-wrap{flex:1; position:relative; min-height:0;}
  iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
    background:var(--bg); display:none;
  }
  iframe.active{display:block;}
  #loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:14px; pointer-events:none;
  }
</style>
</head>
<body>

<div id="shell-nav">
  <button class="switch-btn" id="btn-transfers" onclick="switchSystem('transfers')">🏦 نظام الحوالات البنكية</button>
  <button class="switch-btn" id="btn-accounting" onclick="switchSystem('accounting')">📊 النظام المحاسبي</button>
  <span class="brand">النظام الموحد</span>
</div>

<div id="frame-wrap">
  <div id="loading">جاري التحميل...</div>
  <iframe id="frame-transfers" title="نظام الحوالات البنكية"></iframe>
  <iframe id="frame-accounting" title="النظام المحاسبي"></iframe>
</div>

<script>
const SYS_KEY='unified_active_system';
const SRC={transfers:'transfers.html', accounting:'accounting.html'};
const loaded={transfers:false, accounting:false};

function switchSystem(name){
  const frame=document.getElementById('frame-'+name);
  const loadingEl=document.getElementById('loading');
  if(!loaded[name]){
    loadingEl.style.display='flex';
    frame.addEventListener('load',()=>{loadingEl.style.display='none';},{once:true});
    frame.src=SRC[name];
    loaded[name]=true;
  }
  ['transfers','accounting'].forEach(n=>{
    document.getElementById('frame-'+n).classList.toggle('active', n===name);
    document.getElementById('btn-'+n).classList.toggle('active', n===name);
  });
  try{localStorage.setItem(SYS_KEY,name);}catch(e){}
}

let initial='transfers';
try{initial=localStorage.getItem(SYS_KEY)||'transfers';}catch(e){}
if(!SRC[initial])initial='transfers';
switchSystem(initial);
</script>

</body>
</html>
